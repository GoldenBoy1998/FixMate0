openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: FixMate REST API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RegisterInput" } }
      responses:
        "201": { description: Registered }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/LoginInput" } }
      responses:
        "200": { description: Authenticated }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses: { "204": { description: Logged out } }
  /auth/me:
    get:
      operationId: currentUser
      tags: [auth]
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /categories:
    get:
      operationId: listCategories
      tags: [requests]
      responses:
        "200":
          description: Enabled categories
          content:
            application/json: { schema: { $ref: "#/components/schemas/CategoryList" } }
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Visible requests } }
    post:
      operationId: createRequest
      tags: [requests]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CreateRequestInput" } }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { description: Request and history }
        "404": { $ref: "#/components/responses/NotFound" }
  /requests/{id}/assign:
    post:
      operationId: assignRequest
      tags: [requests]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses: { "200": { description: Assigned } }
  /requests/{id}/status:
    post:
      operationId: updateRequestStatus
      tags: [requests]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses: { "200": { description: Updated } }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: fixmate_session }
  parameters:
    RequestId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: Bad request }
    Unauthorized: { description: Authentication required }
    Conflict: { description: Conflict }
    NotFound: { description: Not found }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    RegisterInput:
      type: object
      required: [displayName, password, role]
      properties:
        displayName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, minLength: 8, writeOnly: true }
        role: { type: string, enum: [customer, technician] }
    LoginInput:
      type: object
      required: [identity, password]
      properties:
        identity: { type: string }
        password: { type: string, writeOnly: true }
    CategoryList:
      type: object
      properties: { categories: { type: array, items: { type: object } } }
    CreateRequestInput:
      type: object
      required: [title, description, categoryId, state, city]
      properties:
        title: { type: string }
        description: { type: string }
        categoryId: { type: string, format: uuid }
        state: { type: string }
        city: { type: string }
        address: { type: string }
        preferredDate: { type: string, format: date-time }
