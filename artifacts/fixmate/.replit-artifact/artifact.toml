kind = "web"
previewPath = "/"
title = "FixMate"
description = "An Arabic-first maintenance services marketplace MVP connecting customers with qualified technicians in Sudan. Demonstrates service discovery, maintenance requests, technician onboarding, and role-based dashboards using local demo data."
version = "1.0.0"
id = "artifacts/fixmate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22933

[services.development]
run = "pnpm --filter @workspace/fixmate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fixmate", "run", "build" ]
serve = "static"
publicDir = "artifacts/fixmate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22933"
BASE_PATH = "/"
